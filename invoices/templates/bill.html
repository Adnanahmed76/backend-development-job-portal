<!DOCTYPE html>
<html>

<head>
    <title>Invoice</title>
</head>

<body>

    <h1>Invoice Details</h1>

    {% for invoice in all_invoices %}

    <p>
        Invoice {{ invoice.number }} -
        {{ invoice.customer }} -
        {{ invoice.amount }}
    </p>

    {% if invoice.amount > 7000 %}
    <p>This is a large invoice</p>
    {% else %}
    <p>This is a regular invoice</p>
    {% endif %}

    {% endfor %}

</body>

</html>
